version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=mndptservers
      - POSTGRES_USER=mndptuser
      - POSTGRES_DB=mndptapp

  webdav:
    image: ugeek/webdav:amd64
    ports:
      - 8080:80
    volumes:
      - webdav-data:/media
    environment:
      - USERNAME=${WEBDAV_USER}
      - PASSWORD=${WEBDAV_PASS}
      - UID=1000
      - GID=1000
      - TZ=Indian/Antananarivo

  fileupload:
    image: 192.168.2.254:5000/fileupload:1.1.1
    ports: 
      - 8003:8003
    environment:
      - WEBDAV_USER=${WEBDAV_USER}
      - WEBDAV_PASS=${WEBDAV_PASS}
      - WEBDAV_HOST=http://webdav
      - PUBLIC_UPLOAD_URL=${FRONTEND_PUBLIC_URL:-https://192.168.2.254:8001}
      - PORT=8003
    volumes:
      - webdav-data:/fileupload/data
          
  backend:
    image: 192.168.2.254:5000/backend:1.2.0
    ports:
      - 8002:8002
    environment:
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_USER=mndptuser
      - DB_PASSWORD=mndptservers
      - DB_NAME=mndptapp
      - DB_PORT=5432
      - PORT=8002
      - EXPIRE_IN=60m

  frontend:
    image: 192.168.2.254:5000/frontend:1.3.8
    ports:
      - target: 443
        published: 8001
        protocol: tcp
        mode: ingress
    environment:
      BACKEND_URL: ${FRONTEND_PUBLIC_URL:-https://192.168.2.254:8001}
      UPLOAD_URL: ${FRONTEND_PUBLIC_URL:-https://192.168.2.254:8001}
      DOWNLOAD_URL: ${FRONTEND_PUBLIC_URL:-https://192.168.2.254:8001}/image
    secrets:
      - frontend_tls_cert
      - frontend_tls_key
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

secrets:
  frontend_tls_cert:
    external: true
  frontend_tls_key:
    external: true

volumes:
  postgres-data:
    name: postgres-data
  webdav-data:
    name: webdav-data
  webdav-data-sub:
    name: webdav-data-sub
