<ion-header>
  <ion-toolbar>
    <ion-button slot="start" fill="clear" (click)="close()">
      <ion-icon name="caret-back-outline" slot="icon-only" color="dark"></ion-icon>
    </ion-button>
    <ion-title>{{'GLOBAL.PRINTCARD' | translate}}</ion-title>
    <ion-button slot="end" fill="clear" (click)="print()">
      <ion-icon slot="icon-only" name="print"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div id="print-section">
    <div id="qr-code">
      <qr-code [value]="data.id" [size]="200"></qr-code>
    </div>
  </div>

</ion-content>
