<app-header></app-header>
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-searchbar
    placeholder="{{'GLOBAL.FILTER' | translate}}"
    [(ngModel)]="filterTerm"
    animated="true"
  >
  </ion-searchbar>
  <ion-list *ngFor="let emps of employees | filter:filterTerm ; let i=index ">
    <ion-item-sliding>
      <ion-item
        (click)="editEmployee(i)"
        [class.selected]="selectedIndex === i"
      >
        <ion-avatar>
          <div *ngIf="emps.photo !== ''; else noPhoto">
            <img src="{{emps.photo}}" />
          </div>
          <ng-template #noPhoto>
            <img src="{{urlPhoto}}" />
          </ng-template> </ion-avatar
        >&nbsp;
        <ion-label
          ><strong>{{emps.lastname}} {{emps.firstname}}</strong><br />
          <ion-note
            >IM: {{emps.jobServiceNumber}}, {{emps.jobTitle}},
            {{emps.jobDepartment}}</ion-note
          >
        </ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="light" (click)="delEmployee(i)">
          <ion-icon name="trash" slot="icon-only"></ion-icon> </ion-item-option
        >&nbsp;
        <ion-item-option color="light" (click)="createBadge(i)">
          <ion-icon
            name="id-card-outline"
            slot="icon-only"
          ></ion-icon> </ion-item-option
        >&nbsp;
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="addEmployee()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
