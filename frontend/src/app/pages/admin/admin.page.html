<app-header></app-header>
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-searchbar placeholder="{{'GLOBAL.FILTER' | translate}}" [(ngModel)]="filterTerm" animated="true">
  </ion-searchbar>
  <ion-list *ngFor="let elem of users | filter:filterTerm ; let i=index">
    <ion-item-sliding>
      <ion-item lines="none" (click)="edit(i)" [class.selected]="selectedIndex === i">
        <ion-label><strong>{{elem.username}}</strong><br>
          <ion-note>{{elem.email}}</ion-note>
          <ion-note></ion-note>
        </ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="light" (click)="delete(i)">
          <ion-icon name="trash" slot="icon-only"></ion-icon>
        </ion-item-option>&nbsp;
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

</ion-content>
