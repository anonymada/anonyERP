version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=mndptservers
      - POSTGRES_USER=mndptuser
      - POSTGRES_DB=mndptapp

  webdav:
    image: ugeek/webdav:amd64
    volumes:
      - webdav-data:/media
    environment:
      - USERNAME=${WEBDAV_USER}
      - PASSWORD=${WEBDAV_PASS}
      - UID=1000
      - GID=1000
      - TZ=Indian/Antananarivo

  fileupload:
    image: 192.168.2.254:5000/fileupload:1.1.1
    environment:
      - WEBDAV_USER=${WEBDAV_USER}
      - WEBDAV_PASS=${WEBDAV_PASS}
      - WEBDAV_HOST=http://webdav
      - PUBLIC_UPLOAD_URL=${FRONTEND_PUBLIC_URL:-https://192.168.2.254:8001}
      - PORT=8003
      - TLS_CERT_FILE=/run/secrets/frontend_tls_cert
      - TLS_KEY_FILE=/run/secrets/frontend_tls_key
    volumes:
      - webdav-data:/fileupload/data
    secrets:
      - frontend_tls_cert
      - frontend_tls_key
          
  backend:
    image: 192.168.2.254:5000/backend:latest
    environment:
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_USER=mndptuser
      - DB_PASSWORD=mndptservers
      - DB_NAME=mndptapp
      - DB_PORT=5432
      - PORT=8002
      - EXPIRE_IN=60m

  frontend:
    image: 192.168.2.254:5000/frontend:1.2.3
    ports:
      - target: 443
        published: 8001
        protocol: tcp
        mode: ingress
    environment:
      BACKEND_URL: https://192.168.2.254:8001/api/
      UPLOAD_URL: https://192.168.2.254:8001/upload-file/
      DOWNLOAD_URL: https://192.168.2.254:8001/image/
      WEBDAV_URL: https://192.168.2.254:8001/webdav/
    secrets:
      - frontend_tls_cert
      - frontend_tls_key
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

secrets:
  frontend_tls_cert:
    external: true
  frontend_tls_key:
    external: true

volumes:
  postgres-data:
    name: postgres-data
  webdav-data:
    name: webdav-data
  webdav-data-sub:
    name: webdav-data-sub
