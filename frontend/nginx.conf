map $http_destination $webdav_destination {
    ~^https?://[^/]+/webdav/(.*)$ $scheme://$host/$1;
    default $http_destination;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name frontend;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name frontend;
    ssl_certificate /run/secrets/frontend_tls_cert;
    ssl_certificate_key /run/secrets/frontend_tls_key;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /assets/env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass https://backend:8002;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /upload-file/ {
        client_max_body_size 10m;
        proxy_pass https://fileupload:8003;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /image/ {
        proxy_pass https://fileupload:8003;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /webdav/ {
        client_max_body_size 0;
        proxy_pass http://webdav/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $webdav_destination;
        proxy_set_header Overwrite $http_overwrite;
    }

    location ~* \.(?:js|css|map|json|wasm|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}